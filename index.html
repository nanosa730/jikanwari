<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時間割メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F4;--surface:#FFFFFF;--sunk:#F6F8F9;--ink:#1D2A36;--muted:#5A6977;--line:#D2DBE2;
  --accent:#2C6A56;--accent-ink:#FFFFFF;--accent-soft:#DCEBE4;--warn:#B3412C;--warn-soft:#F6E1DC;--caution:#8A6514;--caution-soft:#F5ECD6;
  --card-ink:#1D2A36;--sel:#1E5AA8;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181D;--surface:#1A2229;--sunk:#151C22;--ink:#E3E9EE;--muted:#93A2AF;--line:#2D3943;
  --accent:#5DB291;--accent-ink:#0E1A15;--accent-soft:#1E3A30;--warn:#E8826C;--warn-soft:#3A221D;--caution:#E0B656;--caution-soft:#352B14;--sel:#7DB3FF;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12181D;--surface:#1A2229;--sunk:#151C22;--ink:#E3E9EE;--muted:#93A2AF;--line:#2D3943;
  --accent:#5DB291;--accent-ink:#0E1A15;--accent-soft:#1E3A30;--warn:#E8826C;--warn-soft:#3A221D;--caution:#E0B656;--caution-soft:#352B14;--sel:#7DB3FF;color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0}
.save{font-size:12px;color:var(--muted);margin-left:auto}
.steps{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;border:0;background:none;padding:10px 12px 11px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;font-weight:700}
.step[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.step[aria-current="true"] b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:820px){
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;overflow:visible;padding:4px 10px 10px}
  .step{padding:8px 8px;border-bottom:0;border-radius:8px;font-size:13px;line-height:1.3;white-space:normal;text-align:left;min-height:44px;background:var(--sunk)}
  .step b{flex:none}
  .step[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
}

main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:22px;margin:4px 0 4px;font-weight:700}
h3{font-size:16px;margin:28px 0 8px;font-weight:700}
.lead{color:var(--muted);margin:0 0 18px;max-width:46em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{padding:12px 26px;font-size:16px}
.btn.danger{color:var(--warn)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:4.5em}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--sunk)}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.list{border-collapse:collapse;width:100%}
table.list th{font-size:12px;color:var(--muted);font-weight:400;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:13px;margin:1px 3px 1px 0;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tcard .hd{display:flex;gap:8px;align-items:center}
.tcard .hd input{flex:1}
.load{font-size:13px;color:var(--muted);margin:6px 0 4px}

/* slot picker */
.pick{border-collapse:separate;border-spacing:3px;margin-top:4px}
.pick th{font-size:12px;color:var(--muted);font-weight:400;padding:0 2px}
.pick td{width:34px;height:28px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);cursor:pointer;text-align:center;font-size:12px;user-select:none}
.pick td.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.pick.pin td.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pick td.na{visibility:hidden}

/* checks */
.msg{border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.msg.warn{background:var(--caution-soft);color:var(--caution)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.progress{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px;max-width:420px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* timetable — magnet board */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
table.tt th{font-weight:700;font-size:13px;color:var(--muted);padding:2px}
table.tt th.p{width:30px}
table.tt td{height:66px;padding:0;vertical-align:stretch}
.mag{height:100%;min-height:62px;border-radius:7px;background:var(--sunk);border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;padding:3px;text-align:center;line-height:1.3;position:relative}
.mag.f{border:0;color:var(--card-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.18)}
.mag .s{font-weight:700;font-size:15px}
.mag .t{font-size:11.5px;opacity:.85}
.mag .pinmark{position:absolute;top:3px;right:5px;font-size:10px;opacity:.7}
.pindot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.mag .rm{font-size:11px;opacity:.75}
.mag.f.okdrop{outline:3px dashed var(--accent);outline-offset:-2px}
.mag.okdrop{border:2px dashed var(--accent);background:var(--accent-soft)}
.manualset{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.manualset summary{cursor:pointer;font-size:14px}
.mag.hl{outline:3px solid var(--warn);outline-offset:1px;z-index:2;animation:hlp 1s ease-in-out 3}
@keyframes hlp{50%{outline-offset:4px}}
.mag.mk::after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 1.5px var(--surface)}
.sgrp{margin-top:10px}
.sitems{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.sitem{border:1px solid currentColor;background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;text-align:left}
.sitem.on{background:var(--warn-soft);border-color:var(--warn);font-weight:700}
.mag.tm{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.15)}
.mag.f .s{color:#1D2A36}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);display:inline-block}
.outbtn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;font-size:15px;font-weight:700;border-radius:9px}
.outbtn.print{border:2px solid var(--accent);color:var(--accent);background:var(--surface)}
.outbtn.print:hover{background:var(--accent-soft)}
.mag.na{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--line) 6px 7px);border-style:solid;cursor:default}
.mag.na .x{color:var(--warn);font-weight:700;font-size:16px;line-height:1}
.koma{display:inline-block;min-width:44px;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.koma.over{background:var(--warn-soft);color:var(--warn)}
.koma.big{font-size:15px;padding:3px 10px;margin-left:4px}
table.ov td.kc{padding-left:8px;vertical-align:middle}
table.ov th.kh{padding-left:8px;font-size:11px;line-height:1.3}
.asx{display:block;font-size:10.5px;font-weight:700;color:#7A5A00;background:#F5E08A;border-radius:4px;padding:0 4px;margin-top:2px;line-height:1.4;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.ov .asx{font-size:9px;padding:0 2px;margin-top:1px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-bar,.dock-sheet{pointer-events:auto;max-width:1160px;margin:0 auto;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:12px}
.dock-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px}
.dock-sheet{padding:12px;margin-bottom:8px}
.dock-list{max-height:min(40vh,320px);overflow:auto;margin-top:8px}
.dock-sheet.rel{max-height:min(52vh,460px);overflow:auto}
.rel-grid table.tt td{height:44px}
.rel-grid .mag{min-height:40px}
.rel-grid .mag .s{font-size:13px}
.dock-hist{display:flex;gap:4px}
.snaprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dock-info{flex:1;min-width:180px;line-height:1.4}
.dock-hint{font-size:12px;color:var(--muted)}
.dock-acts{display:flex;gap:6px;flex-wrap:wrap}
body.has-dock main{padding-bottom:160px}
body.has-dock .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.zoomctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.zoomval{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
table.list.shpat td,table.list.shpat th{text-align:center}
.shpat td.sh{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mag.sel{outline:3px solid var(--sel);outline-offset:1px}
.mag.drop{border-color:var(--sel);border-style:solid}
table.ov{border-collapse:separate;border-spacing:2px}
table.ov th{font-size:12px;color:var(--muted);font-weight:400;padding:1px 2px;white-space:nowrap}
table.ov th.dh{font-weight:700;color:var(--ink);border-bottom:2px solid var(--line)}
table.ov th.rh{position:sticky;left:0;background:var(--surface);z-index:1;text-align:right;padding-right:6px;font-weight:700;color:var(--ink)}
table.ov td{padding:0}
table.ov .mag{width:44px;min-height:40px;height:40px;border-radius:5px}
table.ov .mag .s{font-size:13px}
table.ov .mag .t{font-size:10px}
table.ov td.dstart{padding-left:6px}
.unplaced{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unplaced button{border:1.5px dashed var(--line);background:var(--sunk);border-radius:7px;padding:5px 10px;cursor:pointer;text-align:left}
.unplaced button:hover{border-color:var(--muted)}
.unplaced .cnt{display:inline-block;margin-left:2px;padding:0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.unplaced button.sel{outline:3px solid var(--sel)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;max-width:min(92vw,560px);font-size:14px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.rule.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rule .rt{display:flex;gap:10px;align-items:baseline}
.rule .rt input[type=checkbox]{width:18px;height:18px;flex:none;position:relative;top:3px;accent-color:var(--accent)}
.rule .rt label{font-weight:700;line-height:2}
.rule .rt input[type=number]{width:3.4em;margin:0 3px}
.rule .rb{color:var(--muted);font-size:14px;margin:2px 0 6px 28px}
.rule .rx{margin-left:28px}
.rule.soft{border-color:var(--caution);box-shadow:inset 4px 0 0 var(--caution)}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0;font-size:14px}
.prow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.prow input[type=number]{width:3.4em}
.prow:not(.on) span{opacity:.55}
.ai-q{background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:6px 12px;margin:12px 0 6px auto;max-width:85%;width:fit-content;white-space:pre-wrap}
.ai-a{margin:0 0 8px;max-width:92%}
.ai-r{white-space:pre-wrap;line-height:1.75}
.ai-ops{margin:4px 0 8px;padding-left:18px;font-size:13px}
.ai-ops .ok{color:var(--accent)}.ai-ops .ng{color:var(--warn)}

/* modal */
.ov-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;padding:18px;border:1px solid var(--line)}
.modal h3{margin-top:0}
.field{margin:12px 0}
.field > .lab{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:8px;min-height:120px}

@media (max-width:600px){
  main{padding:16px 12px 80px}
  table.tt td{height:58px}
  .mag .s{font-size:14px}
  table.tt{border-spacing:3px}
  .mag .rm{display:none}
}
@media print{
  .top,.noprint,body::before{display:none!important}
  body{background:#fff;color:#000}
  .board{border:0;padding:0}
  main{padding:0}
  .mag{border:1px solid #999!important;box-shadow:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><h1 class="brand">時間割メーカー</h1><span class="save" id="save"></span></div>
  <nav class="steps" id="steps"></nav>
</header>
<main id="main"></main>
<div id="modal"></div>
<script>
// ===== SOLVER START =====
function Solver(st){
  const D=st.days.length, ppd=st.periods.slice(), P=Math.max(1,...ppd), S=D*P;
  this.D=D;this.P=P;this.S=S;this.ppd=ppd;
  const cI={},tI={},rI={},sI={};
  st.classes.forEach((c,i)=>cI[c.id]=i); st.teachers.forEach((t,i)=>tI[t.id]=i);
  st.rooms.forEach((r,i)=>rI[r.id]=i); st.subjects.forEach((s,i)=>sI[s.id]=i);
  this.cI=cI;this.tI=tI;
  const units=[]; this.issues=[];
  st.lessons.forEach((l,li)=>{
    const si=sI[l.subject]; if(si===undefined) return;
    const sub=st.subjects[si];
    const cls=(l.classes||[]).map(x=>cI[x]).filter(x=>x!==undefined);
    const tch=(l.teachers||[]).map(x=>tI[x]).filter(x=>x!==undefined);
    if(!cls.length&&!tch.length) return;
    const room=sub.room&&rI[sub.room]!==undefined?rI[sub.room]:-1;
    const L=Math.max(1,sub.len||1); let h=Math.max(0,l.hours|0); const lens=[];
    while(h>=L){lens.push(L);h-=L} if(h>0)lens.push(h);
    const pins=(l.pins||[]).map(k=>{const [d,p]=k.split('-').map(Number);return d*P+p});
    const asst=!!sub.assist&&cls.length>0;
    lens.forEach((len,k)=>units.push({id:units.length,li,lessonId:l.id,cls:asst?[]:cls,acls:asst?cls:null,tch,room,subj:si,len,
      maxPD:sub.maxPerDay===0?99:(sub.maxPerDay||1),pin:k<pins.length?pins[k]:-1,w:1,manual:!!sub.manual}));
  });
  this.units=units;
  this.classOcc=st.classes.map(()=>new Int32Array(S).fill(-1));
  this.teachOcc=st.teachers.map(()=>new Int32Array(S).fill(-1));
  this.tUn=st.teachers.map(t=>{const a=new Uint8Array(S);(t.unavail||[]).forEach(k=>{const [d,p]=k.split('-').map(Number);if(d<D&&p<P)a[d*P+p]=1});return a});
  this.roomCap=st.rooms.map(r=>Math.max(1,r.cap|0));
  this.roomOcc=st.rooms.map(()=>Array.from({length:S},()=>[]));
  this.pos=new Int32Array(units.length).fill(-1);
  // ---- rules
  const R=st.rules||{};this.R=R;this.tNames=st.teachers.map(t=>t.name);
  const gOf=n=>{const m=String(n||'').match(/^(\d+)年/);return m?m[1]:''};
  this.gClasses={};st.classes.forEach((c,i)=>{const g=c.special?'':gOf(c.name);if(g)(this.gClasses[g]=this.gClasses[g]||[]).push(i)});
  this.tGrade=st.teachers.map(t=>t.grade||'');this.gMembers={};this.tGrade.forEach((g,i)=>{if(g)(this.gMembers[g]=this.gMembers[g]||[]).push(i)});
  units.forEach(U=>{U.gw=Object.keys(this.gClasses).filter(g=>this.gClasses[g].length>=2&&this.gClasses[g].every(c=>U.cls.includes(c)))});
  const exS=r=>new Set(((r&&r.ex)||[]).map(x=>tI[x]).filter(x=>x!==undefined));
  this.rGF=R.gradeFree&&R.gradeFree.on?Math.max(1,R.gradeFree.n|0):0;

// ---------- checks ----------
function checks(){
  const err=[],warn=[];const av=slotsAvail();
  if(!S.classes.length)err.push('クラスが登録されていません。');
  if(!S.lessons.length)err.push('授業が登録されていません。');
  for(const c of S.classes){const n=classHours(c.id);
    if(n>av)err.push(`${c.name}：授業が ${n} 時間あり、コマ数 ${av} を超えています。`);
    else if(n<av&&n>0)warn.push(`${c.name}：${av-n} コマ空きが出ます。`);}
  for(const t of S.teachers){const n=teacherHours(t.id);const free=av-(t.unavail||[]).filter(k=>{const[d,p]=k.split('-').map(Number);return p<(S.periods[d]|0)}).length;
    if(n>free)err.push(`${t.name}先生：持ち時数 ${n} が、授業を入れられる時間 ${free} を超えています。`);}
  const dcount=activeDays().length;
  for(const c of S.classes)for(const s of S.subjects){const L=s.len===2?2:1;let u=0;
    S.lessons.filter(l=>l.subject===s.id&&(l.classes||[]).includes(c.id)).forEach(l=>{u+=Math.ceil((l.hours|0)/L)});
    const mx=s.maxPerDay===0?99:(s.maxPerDay||1);if(u>dcount*mx)err.push(`${c.name}の${s.name}：週 ${u} 回あり、1日の上限（${mx}回）では入りきりません。`);}
  for(const r of S.rooms){const n=S.lessons.filter(l=>{const s=byId(S.subjects,l.subject);return s&&s.room===r.id}).reduce((a,l)=>a+(l.hours|0),0);
    const blk=allPinnedSlots(),cap=(av-blk)*(r.cap|0);
    if(n>cap)err.push(`${r.name}：使う授業が ${n} 時間ありますが、同時に使えるのは${r.cap}クラスまでなので、使える枠は ${cap} です${blk?`（道徳など全クラスが同じ時間に入る ${blk} コマを除く）`:''}。「教科・教室」で同時に使えるクラス数を増やすか、その教科の「使う教室」を見直してください。`);}
  const R=S.rules||{};
  if(R.gradeFree&&R.gradeFree.on)gradeList().forEach(g=>{const n=S.teachers.filter(t=>t.grade===g).length;
    if(!n)warn.push(`${g}年に所属の先生がいないため、「学年の先生を空ける」条件は${g}年には効きません。`);
    else if(n<=R.gradeFree.n)err.push(`${g}年の所属の先生が${n}人のため、「最低${R.gradeFree.n}人は空ける」条件を守れません。`)});
  if(R.maxDay&&R.maxDay.on){const dc=activeDays().length;S.teachers.forEach(t=>{if((R.maxDay.ex||[]).includes(t.id))return;
    const n=S.lessons.filter(l=>(l.classes||[]).length&&(l.teachers||[]).includes(t.id)).reduce((a,l)=>a+(l.hours|0),0);
    if(n>dc*R.maxDay.n)err.push(`${t.name}先生：クラスの授業が${n}コマあり、1日${R.maxDay.n}コマまででは入りきりません。`)})}
  return {err,warn};
}

function matchUnits(s,items,onlyLocked){
  const used=new Uint8Array(s.units.length);const out=[];
  for(const it of items){if(onlyLocked&&!it.lock)continue;
    const c=s.units.filter(U=>!used[U.id]&&U.lessonId===it.lessonId&&U.len===it.len);
    const U=c.find(U=>U.pin===it.s)||c.find(U=>U.pin<0)||c[0];
    if(!U)continue;used[U.id]=1;out.push([U,it]);}
  return out;
}
function buildVS(){
  const s=new Solver(S);s.lock=new Uint8Array(s.units.length);
  for(const [U,it] of matchUnits(s,S.result.items||[],false)){if(s.valid(it.s,U.len)&&s.canPlace(U.id,it.s)){s.place(U.id,it.s);if(it.lock&&U.pin<0)s.lock[U.id]=1}}
  for(const U of s.units)if(U.pin>=0&&s.pos[U.id]<0&&s.canPlace(U.id,U.pin))s.place(U.id,U.pin);
  s._sig=sig();
  return s;
}
function mkSolver(){
  const s=new Solver(S);
  if(S.result)for(const [U,it] of matchUnits(s,S.result.items||[],true)){if(U.pin<0&&s.valid(it.s,U.len)){U.pin=it.s;U.locked=true}}
  s.init();return s;
}
function saveVS(){

  S.result.unplaced=VS.units.length-S.result.items.length;save();
}

// ---------- solver run ----------
function startBuild(){
  const s=mkSolver();
  const total=s.units.filter(U=>!(U.manual&&U.pin<0)).length;let restarts=0;const t0=Date.now();
  let best={pos:null,n:1e9};
  run={s,stop:false};render();
  const tick=()=>{
    if(!run)return;
    const tEnd=Date.now()+40;let fin=false;
    while(Date.now()<tEnd&&!(fin=run.s.step(5))){}
    const cur=run.s.bestCount;
    if(cur<best.n){best={pos:Int32Array.from(run.s.best),n:cur,s:run.s}}
    const placed=total-best.n;
    const bar=document.getElementById('bar'),pt=document.getElementById('progt');
    if(bar)bar.style.width=(placed/Math.max(1,total)*100).toFixed(1)+'%';
    if(pt)pt.textContent=`${placed} / ${total} コマを配置（${Math.round((Date.now()-t0)/1000)}秒）`;
    const el=Date.now()-t0;
    if(fin&&run.s.hasSoft&&!run.stop&&!run.imp){run.imp={t0:Date.now(),start:run.s.softReport().total}}
    if(run.imp&&!run.stop&&Date.now()-run.imp.t0<5000){const tE=Date.now()+40;while(Date.now()<tE)run.s.improve(60);
      const rp=run.s.softReport();if(pt)pt.textContent=`すべて配置しました。「できれば守りたい条件」を調整中…（目安を超えている所 ${Math.round(rp.room+rp.hop+rp.pos)}）`;
      best={pos:Int32Array.from(run.s.pos),n:0,s:run.s};if(rp.total>0){setTimeout(tick,0);return}}
    if(run.imp)best={pos:Int32Array.from(run.s.pos),n:0,s:run.s};
    if(fin||run.stop||el>45000){finish(best);return}
    if(run.s.iter>4000*(restarts+1)&&el<40000){restarts++;run.s=mkSolver()}
    setTimeout(tick,0);
  };
  setTimeout(tick,30);
}
function finish(best){
  const s=best.s;if(best.pos)s.restore(best.pos);
  S.result={sig:sig(),at:Date.now(),items:s.units.filter(U=>s.pos[U.id]>=0).map(U=>{const o={lessonId:U.lessonId,len:U.len,s:s.pos[U.id]};if(U.locked)o.lock=1;return o})};
  S.result.unplaced=s.units.length-S.result.items.length;
  const manualLeft=s.units.filter(U=>U.manual&&s.pos[U.id]<0).length,autoLeft=S.result.unplaced-manualLeft;
  const lostLocks=s.units.filter(U=>U.locked&&s.pos[U.id]<0).length;
  run=null;VS=null;sel=null;save();render();
  toast((autoLeft?`${autoLeft} コマが入りきりませんでした`:'時間割ができました')+(manualLeft?`。手で入れる授業が ${manualLeft} コマ残っています`:'')+(lostLocks?`（固定コマ ${lostLocks} つが条件と重なり外れました）`:''));

}

      if(!base||(base.hours|0)<d.hours){ng.push(cN(cid));return}
      const tch=[...(base.teachers||[]),d.teacher];const ex=ofCls(cid).find(l=>l!==base&&same(l.teachers||[],tch));
      if(base.hours===d.hours&&!ex){base.teachers=tch}else{base.hours-=d.hours;if(ex)ex.hours+=d.hours;else S.lessons.push({id:uid('l'),classes:[cid],subject:d.subject,teachers:tch,hours:d.hours,pins:[]});if(!base.hours)S.lessons=S.lessons.filter(x=>x!==base)}
      ok.push(cN(cid))}
    else{const tts=ofCls(cid).filter(l=>(l.teachers||[]).includes(d.teacher));if(!tts.length){ng.push(cN(cid));return}
      tts.forEach(tt=>{const rest=tt.teachers.filter(x=>x!==d.teacher);const base=ofCls(cid).find(l=>l!==tt&&same(l.teachers||[],rest));
        if(base&&rest.length){base.hours+=tt.hours;S.lessons=S.lessons.filter(x=>x!==tt)}else if(rest.length)tt.teachers=rest;else S.lessons=S.lessons.filter(x=>x!==tt)});ok.push(cN(cid))}});
  draft=null;modal('');VS=null;save();render();
  toast(`${tN(d.teacher)}先生を${d.op==='add'?'加えました':'外しました'}（${ok.length}クラス）${ng.length?`。対象の授業がなかったクラス：${ng.join('・')}`:''}`)}

function readDraft(){
  const m=document.getElementById('modal');if(!m||!draft)return;
  draft.classes=[...m.querySelectorAll('[data-d=cls]:checked')].map(x=>x.value);
  draft.teachers=[...m.querySelectorAll('[data-d=tch]:checked')].map(x=>x.value);
  const sj=m.querySelector('[data-d=subject]');if(sj)draft.subject=sj.value;
  const hr=m.querySelector('[data-d=hours]');if(hr)draft.hours=Math.max(1,parseInt(hr.value)||1);
  const uh=m.querySelector('[data-d=useHome]');if(uh)draft.useHome=uh.checked;
}
function saveLesson(){
  readDraft();const d=draft;
  if(!d.classes.length&&(d.bulk||!d.teachers.length)){toast(d.bulk?'クラスを選んでください':'クラスか先生を選んでください');return}
  if(!d.subject){toast('教科を選んでください');return}
  const sub=byId(S.subjects,d.subject);const units=Math.ceil(d.hours/((sub&&sub.len)||1));
  if(d.pins.length>units){toast(`固定できるのは ${units} か所までです`);return}
  if(d.bulk){
    d.classes.forEach(cid=>{const c=byId(S.classes,cid);const t=d.useHome?homes(c).slice():d.teachers.slice();
      S.lessons.push({id:uid('l'),classes:[cid],subject:d.subject,teachers:t,hours:d.hours,pins:d.pins.slice()})});
    toast(`${d.classes.length} クラスに追加しました`);
  }else if(d.id){const l=byId(S.lessons,d.id);Object.assign(l,{classes:d.classes,subject:d.subject,teachers:d.teachers,hours:d.hours,pins:d.pins.slice()})}
  else S.lessons.push({id:uid('l'),classes:d.classes,subject:d.subject,teachers:d.teachers,hours:d.hours,pins:d.pins.slice()});
  draft=null;modal('');save();render();
}

    xlsx(){modal('');exportXlsx()},
    csvCls(){modal('');offerFile('時間割_全クラス.csv',csvOf('cls'),'text/csv')},
    csvTch(){modal('');offerFile('時間割_全教員.csv',csvOf('tch'),'text/csv')},
    exportJson(){offerFile('時間割設定.json',JSON.stringify(S,null,1),'application/json')},
    loadSample(){askConfirm('いまの入力内容を見本データに置き換えますか？','置き換える',()=>{S=makeSample();VS=null;save();render();toast('見本データ（中学校9クラス）を読み込みました')})},
    clearAll(){askConfirm('すべての入力内容を消去しますか？元に戻せません。','すべて消す',()=>{
      S={v:1,days:['月','火','水','木','金','土'],periods:[6,6,6,6,6,0],classes:[],teachers:[],rooms:[],subjects:makeSample().subjects.map(s=>Object.assign({},s,{room:''})),lessons:[],result:null};VS=null;sel=null;save();render();toast('すべて消去しました')})},
    restoreBackup(){askConfirm('取り込み前の入力内容に戻しますか？いまの内容は置き換わります。','戻す',()=>{try{const v=JSON.parse(localStorage.getItem(LS+'-backup'));if(v&&v.v===1){S=v;VS=null;localStorage.removeItem(LS+'-backup');save();render();toast('戻しました')}}catch(e){toast('戻せませんでした')}})},
    confirmYes(){const fn=pendingConfirm;pendingConfirm=null;modal('');if(fn)fn()}
  };
  if(A[act])A[act]();
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f,id=t.dataset&&t.dataset.id;
  if(t.id==='importFile'){const file=t.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||v.v!==1||!Array.isArray(v.lessons))throw 0;S=v;VS=null;save();render();toast('読み込みました')}catch(_){toast('このファイルは読み込めません。時間割メーカーで書き出したファイルを選んでください。')}};r.readAsText(file);return}
  if(t.dataset&&t.dataset.t==='op'){readTT();ttModal();return}
  if(t.dataset&&t.dataset.d==='useHome'){readDraft();lessonModal();return}
  if(t.dataset&&t.dataset.d==='subject'){return}
  if(!f)return;
  const o=id&&(byId(S.classes,id)||byId(S.teachers,id)||byId(S.subjects,id)||byId(S.rooms,id));
  const map={
    period(){S.periods[+t.dataset.i]=Math.max(0,Math.min(10,parseInt(t.value)||0))},
    cname(){o.name=t.value.trim()||o.name},cspecial(){o.special=t.checked},chome(){const a=homes(o).slice();a[+t.dataset.i]=t.value;o.homerooms=[...new Set(a.filter(Boolean))]},
    tname(){o.name=t.value.trim()||o.name},
    sname(){o.name=t.value.trim()||o.name},sshort(){o.short=t.value.trim()},scolor(){o.color=t.value},sroom(){o.room=t.value},
    slen(){o.len=t.checked?2:1},smax(){o.maxPerDay=parseInt(t.value)},
    rname(){o.name=t.value.trim()||o.name},rcap(){o.cap=Math.max(1,parseInt(t.value)||1)},
    lfilter(){lessonFilter=t.value},
    tgrade(){o.grade=t.value},
    shn(){byId(S.shonin,id).novice=t.value},shm(){byId(S.shonin,id).mentor=t.value},shd(){byId(S.shonin,id).day=t.value},
    tpart(){o.part=t.checked},
    tpartmax(){o.partMax=Math.max(0,parseInt(t.value)||0);save();return 'noglobal'},
    torder(){const n=parseInt(t.value);if(!n){render();return 'noglobal'}orderOpen=true;moveTeacher(id,n-1);save();render();const el=document.querySelector(`[data-f=torder][data-id="${id}"]`);if(el)el.focus();return 'noglobal'},
    fsub(){byId(S.fixed,id).subject=t.value},
    fgrade(){const f=byId(S.fixed,id);f.grades=[...document.querySelectorAll(`[data-f=fgrade][data-id="${id}"]:checked`)].map(x=>x.value)},
    fslot(){const f=byId(S.fixed,id);const vals=[...document.querySelectorAll(`[data-f=fslot][data-id="${id}"]`)].map(x=>x.value).filter(Boolean);if(new Set(vals).size<vals.length){toast('同じ時間が2回選ばれています');return 'noglobal'}f.slots=vals},
    fhours(){const f=byId(S.fixed,id);f.hours=Math.max(1,Math.min(10,parseInt(t.value)||1));f.slots=(f.slots||[]).slice(0,f.hours)},
    ftm(){byId(S.fixed,id).teacherMode=t.value},
    fmode(){byId(S.fixed,id).mode=t.value},
    ron(){S.rules[t.dataset.k].on=t.checked},
    amEnd(){S.rules.amEnd=Math.max(1,Math.min(7,parseInt(t.value)||4))},
    sdon(){S.rules.sameDay[+t.dataset.i].on=t.checked},
    sda(){S.rules.sameDay[+t.dataset.i].a=t.value},
    sdb(){S.rules.sameDay[+t.dataset.i].b=t.value},
    adjon(){S.rules.adj[+t.dataset.i].on=t.checked},
    adja(){const r=S.rules.adj[+t.dataset.i];r.a=t.value;r.b=(r.b||[]).filter(x=>x!==t.value)},
    adjb(){const i=+t.dataset.i;S.rules.adj[i].b=[...document.querySelectorAll(`[data-f=adjb][data-i="${i}"]:checked`)].map(x=>x.value)},
    pon(){posList(t.dataset.l)[+t.dataset.i].on=t.checked},
    pw(){posList(t.dataset.l)[+t.dataset.i].w=Math.max(1,parseInt(t.value)||1)},
    pwhere(){posList(t.dataset.l)[+t.dataset.i].where=t.value},
    pmax(){posList(t.dataset.l)[+t.dataset.i].max=Math.max(0,parseInt(t.value)||0)},
    sron(){S.rules.soft.rooms[+t.dataset.i].on=t.checked},
    srroom(){S.rules.soft.rooms[+t.dataset.i].room=t.value},
    srcap(){S.rules.soft.rooms[+t.dataset.i].cap=Math.max(0,parseInt(t.value)||0)},
    hopon(){S.rules.soft.gradeHop.on=t.checked},
    nohopon(){S.rules.noHopT.on=t.checked},
    smanual(){o.manual=t.checked},
    sassist(){o.assist=t.checked},
    rnum(){S.rules[t.dataset.k][t.dataset.p]=Math.max(1,parseInt(t.value)||1)},
    mname(){const l=byId(S.lessons,id);l.name=t.value.trim()||l.name;save();return 'noglobal'},
    mhours(){const l=byId(S.lessons,id);l.hours=Math.max(1,Math.min(10,parseInt(t.value)||1));l.pins=(l.pins||[]).slice(0,l.hours)},
    mslot(){const l=byId(S.lessons,id);const vals=[...document.querySelectorAll(`[data-f=mslot][data-id="${id}"]`)].map(x=>x.value).filter(Boolean);
      if(new Set(vals).size<vals.length){toast('同じ時間が2回選ばれています');return 'noglobal'}l.pins=vals;setTimeout(()=>warnMeeting(l),50)},
    vcls(){view.cls=t.value;sel=null;renderResult();return 'noglobal'},    unf(){unFilter=t.value;renderResult();return 'noglobal'},dockf(){dockF=t.value;renderResult();return 'noglobal'},hlall(){hlAll=t.checked;softOpen=true;renderResult();return 'noglobal'},vtch(){view.tch=t.value;renderResult();return 'noglobal'}
  };
  if(!map[f])return;
  if(map[f]()==='noglobal')return;
  VS=null;save();
  if(['tname','scolor','sshort'].includes(f))return; // keep focus; no structural change
  render();
});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='orderBox')orderOpen=e.target.open;if(e.target&&e.target.id==='softBox')softOpen=e.target.open},true);
document.addEventListener('input',e=>{if(e.target.id==='aiq')aiDraft=e.target.value});
document.addEventListener('keydown',e=>{
  if(tab===5&&VS&&!document.querySelector('.ov-bg')&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){
    if(e.key==='Escape'&&(sel!=null||dockOpen)){sel=null;dockOpen=false;renderResult();return}
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();if(e.shiftKey)doRedo();else doUndo();return}
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){e.preventDefault();doRedo();return}
    if((e.key==='Delete'||e.key==='Backspace')&&sel!=null&&VS.pos[sel]>=0&&VS.units[sel].pin<0){e.preventDefault();VS.remove(sel);VS.lock[sel]=0;sel=null;saveVS();renderResult();toast('外しました');return}}
if(e.target.id==='aiq'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();aiAsk();return}
if(e.key==='Escape'&&document.querySelector('.ov-bg')){draft=null;modal('')}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-cell],[data-picker] td[data-k]')){e.preventDefault();e.target.click()}});

// ---------- start ----------
S=load()||makeSample();
try{tab=Math.min(5,parseInt(localStorage.getItem(LS+'-tab'))||0)}catch(_){}
setSave(load()?'この端末に保存しています':'見本データを表示中');
render();
connectDb();
</script></body></html>
